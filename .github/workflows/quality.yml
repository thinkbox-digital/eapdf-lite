name: Lite quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  java-builds:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -Deapdf.build.directory=/tmp/eapdf-creator-build verify
      - run: mvn -B -f validator-desktop/pom.xml -Deapdf.build.directory=/tmp/eapdf-validator-build verify
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v6.2.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-docs.txt
      - name: Build and validate the Lite architecture diagram
        run: |
          version=$(cat VERSION)
          python scripts/build_architecture_diagram.py \
            --creator-jar "/tmp/eapdf-creator-build/emailtopdfa-lite-$version.jar" \
            --validator-jar "/tmp/eapdf-validator-build/eapdf-validator-$version.jar" \
            --output "$RUNNER_TEMP/EA-PDF_Software_Architecture.pdf"
  viewer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: browser-viewer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: browser-viewer/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
      - run: npm test
  python-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v6.2.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-validator.lock
      - run: python -B -m unittest discover -s regression -v
