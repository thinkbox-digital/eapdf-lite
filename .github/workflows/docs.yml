name: Documentation
on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'scripts/check_public_docs.py'
      - 'AGENTS.md'
      - 'config/README.md'
      - 'validator-desktop/README.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'docs/**'
      - 'scripts/check_public_docs.py'
      - 'AGENTS.md'
      - 'config/README.md'
      - 'validator-desktop/README.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  privacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check documentation privacy
        run: python scripts/check_public_docs.py
